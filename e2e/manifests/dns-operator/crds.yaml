apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dnszones.dns.datum.net
spec:
  group: dns.datum.net
  names:
    kind: DNSZone
    plural: dnszones
    singular: dnszone
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [domainName, dnsZoneClassName]
            properties:
              domainName:
                type: string
              dnsZoneClassName:
                type: string
          status:
            type: object
            properties:
              ready:
                type: boolean
              message:
                type: string
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dnsrecordsets.dns.datum.net
spec:
  group: dns.datum.net
  names:
    kind: DNSRecordSet
    plural: dnsrecordsets
    singular: dnsrecordset
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [dnsZoneRef, recordType, records]
            properties:
              dnsZoneRef:
                type: object
                required: [name]
                properties:
                  name:
                    type: string
              recordType:
                type: string
                enum: [A, AAAA, CNAME, TXT, MX, NS, SRV]
              records:
                type: array
                items:
                  type: object
                  required: [name, ttl]
                  properties:
                    name:
                      type: string
                    ttl:
                      type: integer
                    a:
                      type: object
                      properties:
                        content:
                          type: string
                    aaaa:
                      type: object
                      properties:
                        content:
                          type: string
                    cname:
                      type: object
                      properties:
                        content:
                          type: string
                    txt:
                      type: object
                      properties:
                        content:
                          type: string
          status:
            type: object
            properties:
              ready:
                type: boolean
              message:
                type: string
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dnszoneclasses.dns.datum.net
spec:
  group: dns.datum.net
  names:
    kind: DNSZoneClass
    plural: dnszoneclasses
    singular: dnszoneclass
  scope: Cluster
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [provider]
            properties:
              provider:
                type: string
              config:
                type: object
                x-kubernetes-preserve-unknown-fields: true
          status:
            type: object
            properties:
              ready:
                type: boolean
    subresources:
      status: {}
