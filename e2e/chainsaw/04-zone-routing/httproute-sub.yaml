apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-sub-zone
  namespace: default
  annotations:
    external-dns.alpha.kubernetes.io/hostname: app.sub.example.com
spec:
  parentRefs:
  - name: default-gateway
    namespace: envoy-gateway-system
  hostnames:
  - app.sub.example.com
  rules:
  - backendRefs:
    - name: whoami
      port: 80
