apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: multi-alpha
  namespace: default
  annotations:
    external-dns.alpha.kubernetes.io/hostname: alpha.example.com
spec:
  parentRefs:
  - name: default-gateway
    namespace: envoy-gateway-system
  hostnames:
  - alpha.example.com
  rules:
  - backendRefs:
    - name: whoami
      port: 80
