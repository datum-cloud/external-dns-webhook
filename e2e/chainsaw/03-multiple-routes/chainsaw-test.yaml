apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: multiple-routes
spec:
  description: |
    Verify that multiple HTTPRoutes each produce their own DNSRecordSet,
    and deleting them removes all records.
  steps:
  - name: assert-clean-state
    try:
    - error:
        resource:
          apiVersion: dns.networking.miloapis.com/v1alpha1
          kind: DNSRecordSet
          metadata:
            namespace: default
            labels:
              external-dns.io/owner: external-dns-e2e
            name: alpha-?*
    - error:
        resource:
          apiVersion: dns.networking.miloapis.com/v1alpha1
          kind: DNSRecordSet
          metadata:
            namespace: default
            labels:
              external-dns.io/owner: external-dns-e2e
            name: beta-?*

  - name: create-both-routes
    try:
    - apply:
        file: httproute-alpha.yaml
    - apply:
        file: httproute-beta.yaml

  - name: assert-alpha-record
    try:
    - assert:
        timeout: 60s
        resource:
          apiVersion: dns.networking.miloapis.com/v1alpha1
          kind: DNSRecordSet
          metadata:
            namespace: default
            labels:
              external-dns.io/owner: external-dns-e2e
          spec:
            dnsZoneRef:
              name: example-com
            recordType: A
            records:
            - name: alpha

  - name: assert-beta-record
    try:
    - assert:
        timeout: 60s
        resource:
          apiVersion: dns.networking.miloapis.com/v1alpha1
          kind: DNSRecordSet
          metadata:
            namespace: default
            labels:
              external-dns.io/owner: external-dns-e2e
          spec:
            dnsZoneRef:
              name: example-com
            recordType: A
            records:
            - name: beta

  - name: delete-both-routes
    try:
    - delete:
        ref:
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          namespace: default
          name: multi-alpha
    - delete:
        ref:
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          namespace: default
          name: multi-beta

  - name: assert-all-records-removed
    try:
    - error:
        timeout: 60s
        resource:
          apiVersion: dns.networking.miloapis.com/v1alpha1
          kind: DNSRecordSet
          metadata:
            namespace: default
            labels:
              external-dns.io/owner: external-dns-e2e
            name: alpha-?*
    - error:
        timeout: 60s
        resource:
          apiVersion: dns.networking.miloapis.com/v1alpha1
          kind: DNSRecordSet
          metadata:
            namespace: default
            labels:
              external-dns.io/owner: external-dns-e2e
            name: beta-?*
