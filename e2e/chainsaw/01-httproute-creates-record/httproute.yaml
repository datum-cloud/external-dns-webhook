apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: test-httproute
  namespace: default
  annotations:
    external-dns.alpha.kubernetes.io/hostname: test-app.example.com
spec:
  parentRefs:
  - name: default-gateway
    namespace: envoy-gateway-system
  hostnames:
  - test-app.example.com
  rules:
  - backendRefs:
    - name: whoami
      port: 80
