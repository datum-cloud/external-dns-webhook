apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 5m
  chart:
    spec:
      chart: external-dns
      version: '>=1.15.0'
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
      interval: 1h
  install:
    createNamespace: true
  values:
    sources:
      - gateway-httproute
      - crd
    provider:
      name: webhook
      webhook:
        image:
          repository: datum-dns-webhook
          tag: e2e-test
          pullPolicy: Never
        args:
          - --owner-id=external-dns-e2e
          - --log-level=debug
          - --port=8888
          - --metrics-port=8080
    rbac:
      additionalPermissions:
        - apiGroups: ["dns.networking.miloapis.com"]
          resources: ["dnszones"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["dns.networking.miloapis.com"]
          resources: ["dnsrecordsets"]
          verbs: ["get", "list", "watch", "create", "update", "delete"]
        - apiGroups: ["externaldns.k8s.io"]
          resources: ["dnsendpoints"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["externaldns.k8s.io"]
          resources: ["dnsendpoints/status"]
          verbs: ["*"]
    txtOwnerId: external-dns-e2e
    logLevel: debug
    interval: 30s
